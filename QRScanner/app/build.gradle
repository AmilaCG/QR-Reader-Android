apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.android.gms.oss-licenses-plugin'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace 'com.auroid.qrscanner'
    compileSdk 37

    defaultConfig {
        applicationId "com.auroid.qrscanner"
        minSdk 24
        targetSdk 37
        versionCode 56
        versionName "3.07.04"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue 'string', 'versionName', versionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // Enable Firebase Analytics & Crashlytics
            resValue("bool", "FIREBASE_ANALYTICS_DEACTIVATED", "false")
            resValue("bool", "FIREBASE_CRASHLYTICS_ENABLED", "true")
        }
        debug {
            // Disable Firebase Analytics & Crashlytics
            resValue("bool", "FIREBASE_ANALYTICS_DEACTIVATED", "true")
            resValue("bool", "FIREBASE_CRASHLYTICS_ENABLED", "false")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Room components
    def roomVersion = '2.8.5'
    implementation "androidx.room:room-runtime:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"

    // Lifecycle components
    def archLifecycleVersion = '2.11.0'
    implementation "androidx.lifecycle:lifecycle-livedata:$archLifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$archLifecycleVersion"

    // CameraX core library
    def camerax_version = '1.6.2'
    implementation "androidx.camera:camera-core:$camerax_version"
    // CameraX Camera2 extensions
    implementation "androidx.camera:camera-camera2:$camerax_version"
    // CameraX Lifecycle library
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    // CameraX View class
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation 'com.google.android.gms:play-services-oss-licenses:17.5.2'

    implementation 'com.google.code.gson:gson:2.14.0'

    // ML Kit barcode decoding components
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Google analytics components
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'com.google.guava:guava:33.7.1-android'

    // Firebase Crashlytics
    implementation 'com.google.firebase:firebase-crashlytics'

    // Subsampling Scale Image View library
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'

    // Google play core library for in-app review API
    implementation 'com.google.android.play:review:2.0.2'
}
